<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto naar 3D</title>
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#14161a; --panel:#1f232a; --tekst:#e8eaed; --zacht:#9aa0a6; --accent:#4f9cff; --groen:#2fa36b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tekst); font:20px/1.5 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:34px; margin:0 0 4px; }
  p.sub { color:var(--zacht); margin:0 0 22px; font-size:18px; }
  .paneel { background:var(--panel); border-radius:16px; padding:20px; margin-bottom:16px; }
  .grote-knoppen { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  button, label.knop { display:flex; align-items:center; justify-content:center; gap:12px; background:var(--accent);
    color:#fff; border:0; border-radius:14px; padding:28px 20px; font-size:26px; font-weight:600; cursor:pointer;
    min-height:110px; text-align:center; }
  button.groen { background:var(--groen); }
  button.tweede { background:#3a414c; font-size:20px; min-height:64px; padding:14px 20px; font-weight:500; }
  button:disabled { opacity:.35; cursor:default; }
  input[type=file] { display:none; }
  #status { color:var(--tekst); min-height:1.5em; margin-top:16px; font-size:20px; }
  #voortgang { width:100%; height:10px; background:#2c323b; border-radius:5px; overflow:hidden; margin-top:10px; }
  #voortgang div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  details { background:var(--panel); border-radius:16px; padding:16px 20px; margin-bottom:16px; }
  summary { cursor:pointer; font-size:20px; color:var(--zacht); }
  .rij { display:flex; flex-wrap:wrap; gap:24px; align-items:center; margin-top:14px; }
  .schuif { display:flex; flex-direction:column; min-width:260px; flex:1; }
  .schuif span { color:var(--zacht); font-size:17px; }
  .schuif input { width:100%; height:32px; }
  .beelden { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .beelden canvas { width:100%; border-radius:8px; background:#000; }
  .beelden figure { margin:0; }
  .beelden figcaption { color:var(--zacht); font-size:15px; }
  #sbs { width:100%; border-radius:8px; margin-top:12px; background:#000; }
  @media (max-width:640px){ .grote-knoppen, .beelden { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Foto naar 3D</h1>
  <p class="sub">1. Kies een foto &nbsp;·&nbsp; 2. Even wachten &nbsp;·&nbsp; 3. Bekijk in 3D. De foto blijft in dit apparaat.</p>

  <div class="paneel">
    <div class="grote-knoppen">
      <label class="knop" for="bestand">📷 Kies foto</label>
      <button id="vr" class="groen" disabled>🥽 Bekijk in 3D</button>
    </div>
    <input id="bestand" type="file" accept="image/*,.heic,.heif">
    <div id="status">Even geduld, het programma wordt geladen…</div>
    <div id="voortgang"><div></div></div>
    <div style="margin-top:14px"><button id="opslaan" class="tweede" disabled>💾 Bewaar 3D-foto</button></div>
  </div>

  <details>
    <summary>⚙ Instellingen en voorbeeld</summary>
    <div class="rij">
      <div class="schuif">
        <span>3D-sterkte: <b id="sterkteW">3,0</b>%</span>
        <input id="sterkte" type="range" min="0.5" max="6" step="0.25" value="3">
      </div>
      <div class="schuif">
        <span>Scherpstelvlak (wat "op de foto" ligt): <b id="vlakW">30</b>%</span>
        <input id="vlak" type="range" min="0" max="100" step="5" value="30">
      </div>
    </div>
    <div class="beelden">
      <figure><canvas id="cFoto"></canvas><figcaption>Origineel</figcaption></figure>
      <figure><canvas id="cDiepte"></canvas><figcaption>Dieptekaart (licht = dichtbij)</figcaption></figure>
    </div>
    <canvas id="sbs"></canvas>
  </details>
</main>

<script type="module">
import { pipeline, env, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.0';
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const MAX_ZIJDE = 3000;          // grootste zijde waarop gewerkt wordt (snelheid)
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };
const balk = p => { $('voortgang').firstElementChild.style.width = (p*100).toFixed(0) + '%'; };

let schatter = null;
let foto = null;      // {w,h,pixels: Uint8ClampedArray RGBA}
let diepte = null;    // Float32Array 0..1, 1 = dichtbij
let links = null, rechts = null; // canvassen
let naam = 'foto';

/* ---------- model laden ---------- */
env.allowLocalModels = false;
env.useBrowserCache = (typeof caches !== 'undefined');
let modelKlaar;  // Promise die klaar is als het model geladen is
async function laadModel() {
  if (location.protocol === 'file:') {
    status('Let op: pagina is direct als bestand geopend. Start hem via start_foto3d.bat (http://localhost) — anders werkt het model niet goed.');
  }
  const heeftGPU = !!navigator.gpu && !!(await navigator.gpu.requestAdapter().catch(() => null));
  const opties = {
    device: heeftGPU ? 'webgpu' : 'wasm',
    dtype: heeftGPU ? 'fp16' : 'fp32',
    progress_callback: p => {
      if (p.status === 'progress' && p.total) { balk(p.loaded / p.total); status(`Model downloaden… ${Math.round(p.loaded/1e6)} / ${Math.round(p.total/1e6)} MB`); }
    }
  };
  try {
    schatter = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', opties);
  } catch (e) {
    console.warn('Eerste poging mislukt, terugval naar wasm/fp32', e);
    schatter = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', { device:'wasm', dtype:'fp32' });
    opties.device = 'wasm';
  }
  balk(0);
  status(`Klaar. Druk op 📷 Kies foto. (rekent met ${opties.device === 'webgpu' ? 'grafische chip' : 'processor'})`);
}

/* ---------- foto inlezen (met juiste draaiing) ---------- */
// Probeer de foto op meerdere manieren te openen (gewone JPG/PNG, via <img>, of HEIC van telefoons)
async function decodeer(bestand) {
  try { return await createImageBitmap(bestand, { imageOrientation: 'from-image' }); } catch (e) { console.warn('createImageBitmap faalde', e); }
  try { return await viaImg(bestand); } catch (e) { console.warn('<img> faalde', e); }
  const isHeic = /\.(heic|heif)$/i.test(bestand.name) || /hei[cf]/i.test(bestand.type);
  if (isHeic) {
    status('HEIC-foto omzetten…');
    let fout1;
    try {
      const { heicTo } = await import('https://cdn.jsdelivr.net/npm/heic-to@1.6.5/dist/heic-to.js');
      return await heicTo({ blob: bestand, type: 'bitmap', options: { imageOrientation: 'from-image' } });
    } catch (e) { fout1 = e; console.warn('heic-to faalde', e); }
    try {
      const { default: heic2any } = await import('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/+esm');
      let jpg = await heic2any({ blob: bestand, toType: 'image/jpeg', quality: 0.95 });
      if (Array.isArray(jpg)) jpg = jpg[0];
      return await createImageBitmap(jpg);
    } catch (e) {
      console.warn('heic2any faalde', e);
      throw new Error('HEIC-foto kon niet omgezet worden: ' + (fout1?.message || fout1) + ' / ' + (e?.message || e));
    }
  }
  const ext = (bestand.name.split('.').pop() || '?').toUpperCase();
  throw new Error(`De browser kan dit bestand (${ext}, ${bestand.type || 'onbekend type'}, ${(bestand.size/1e6).toFixed(1)} MB) niet openen. Probeer een JPG of PNG.`);
}
function viaImg(bestand) {
  return new Promise((ok, fout) => {
    const url = URL.createObjectURL(bestand), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); fout(new Error('img kon niet laden')); };
    img.src = url;
  });
}

async function leesFoto(bestand) {
  const bmp = await decodeer(bestand);
  const schaal = Math.min(1, MAX_ZIJDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * schaal), h = Math.round(bmp.height * schaal);
  if (!w || !h) throw new Error('Foto heeft geen afmetingen');
  const c = $('cFoto'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(bmp, 0, 0, w, h);
  return { w, h, pixels: ctx.getImageData(0, 0, w, h).data, canvas: c };
}

/* ---------- diepte schatten ---------- */
async function schatDiepte(f) {
  const invoer = RawImage.fromCanvas(f.canvas);
  const uit = await schatter(invoer);
  const d = uit.depth;                       // RawImage, 1 kanaal, 0..255
  let bron = d;
  if (d.width !== f.w || d.height !== f.h) bron = await d.resize(f.w, f.h);
  const n = f.w * f.h, kanalen = bron.channels;
  const ruw = new Float32Array(n);
  for (let i = 0; i < n; i++) ruw[i] = bron.data[i * kanalen] / 255;
  return vervaag(ruw, f.w, f.h, Math.max(1, Math.round(f.w / 600)));
}

// lichte vervaging (horizontaal + verticaal) om scheuren aan randen te beperken
function vervaag(a, w, h, r) {
  const t = new Float32Array(a.length), o = new Float32Array(a.length);
  for (let y = 0; y < h; y++) {
    let s = 0, rij = y * w;
    for (let x = -r; x <= r; x++) s += a[rij + Math.min(w-1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      t[rij + x] = s / (2*r+1);
      s += a[rij + Math.min(w-1, x+r+1)] - a[rij + Math.max(0, x-r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += t[Math.min(h-1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      o[y * w + x] = s / (2*r+1);
      s += t[Math.min(h-1, y+r+1) * w + x] - t[Math.max(0, y-r) * w + x];
    }
  }
  return o;
}

/* ---------- één oog renderen: pixels verschuiven + gaten vullen ---------- */
// richting +1 = linkeroog (dichtbij schuift naar rechts), -1 = rechteroog
function maakOog(f, d, richting, maxVerschuiving, vlak) {
  const { w, h, pixels } = f;
  const uit = new Uint8ClampedArray(w * h * 4);
  const zbuf = new Float32Array(w);
  const gevuld = new Uint8Array(w);
  for (let y = 0; y < h; y++) {
    zbuf.fill(-1); gevuld.fill(0);
    const rij = y * w;
    for (let x = 0; x < w; x++) {
      const dz = d[rij + x];
      const verschuif = richting * maxVerschuiving * (dz - vlak) / 2;
      const nx = Math.round(x + verschuif);
      if (nx < 0 || nx >= w) continue;
      if (dz > zbuf[nx]) {               // dichterbij wint
        zbuf[nx] = dz; gevuld[nx] = 1;
        const b = (rij + x) * 4, u = (rij + nx) * 4;
        uit[u] = pixels[b]; uit[u+1] = pixels[b+1]; uit[u+2] = pixels[b+2]; uit[u+3] = 255;
      }
    }
    // gaten vullen met de verste (achtergrond-)buur
    for (let x = 0; x < w; x++) {
      if (gevuld[x]) continue;
      let l = x - 1; while (l >= 0 && !gevuld[l]) l--;
      let r = x + 1; while (r < w && !gevuld[r]) r++;
      let kies;
      if (l < 0 && r >= w) kies = x;
      else if (l < 0) kies = r;
      else if (r >= w) kies = l;
      else kies = zbuf[l] <= zbuf[r] ? l : r;
      const u = (rij + x) * 4, b = (rij + kies) * 4;
      if (kies === x) { const p = (rij + x) * 4; uit[u]=pixels[p]; uit[u+1]=pixels[p+1]; uit[u+2]=pixels[p+2]; }
      else { uit[u] = uit[b]; uit[u+1] = uit[b+1]; uit[u+2] = uit[b+2]; }
      uit[u+3] = 255;
      // gevuld blijft 0 zodat volgende gaten naar echte pixels blijven kijken
    }
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(uit, w, h), 0, 0);
  return c;
}

function tekenDiepte(d, w, h) {
  const c = $('cDiepte'); c.width = w; c.height = h;
  const img = new ImageData(w, h);
  for (let i = 0; i < d.length; i++) { const v = d[i] * 255; img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255; }
  c.getContext('2d').putImageData(img, 0, 0);
}

function bouwStereo() {
  if (!foto || !diepte) return;
  const sterkte = parseFloat($('sterkte').value) / 100;
  const vlak = parseFloat($('vlak').value) / 100;
  const maxV = sterkte * foto.w;
  links = maakOog(foto, diepte, +1, maxV, vlak);
  rechts = maakOog(foto, diepte, -1, maxV, vlak);
  const s = $('sbs'); s.width = foto.w * 2; s.height = foto.h;
  const ctx = s.getContext('2d');
  ctx.drawImage(links, 0, 0); ctx.drawImage(rechts, foto.w, 0);
  if (vrSessie) zetVRBeeld();
}

/* ---------- foto gekozen ---------- */
$('bestand').addEventListener('change', async e => {
  const bestand = e.target.files[0];
  if (!bestand) return;
  if (!schatter) {
    status('Foto gekozen; wachten tot het model geladen is…');
    try { await modelKlaar; } catch { return; }
  }
  naam = bestand.name.replace(/\.[^.]+$/, '');
  $('vr').disabled = true; $('opslaan').disabled = true;
  try {
    status('Foto inlezen…'); balk(0.1);
    foto = await leesFoto(bestand);
    status('Diepte berekenen… (kan even duren)'); balk(0.4);
    const t0 = performance.now();
    diepte = await schatDiepte(foto);
    tekenDiepte(diepte, foto.w, foto.h);
    status('3D-beelden maken…'); balk(0.8);
    await new Promise(r => setTimeout(r, 20));
    bouwStereo();
    balk(0);
    status(`✅ Klaar in ${((performance.now()-t0)/1000).toFixed(1)} s. Druk op de groene knop 🥽 Bekijk in 3D.`);
    $('vr').disabled = !navigator.xr; $('opslaan').disabled = false;
    if (!navigator.xr) status($('status').textContent + ' (VR niet beschikbaar in deze browser)');
  } catch (err) {
    console.error(err); balk(0); status('Er ging iets mis: ' + err.message);
  }
});

let wachtrij = null;
for (const id of ['sterkte', 'vlak']) {
  $(id).addEventListener('input', () => {
    $('sterkteW').textContent = parseFloat($('sterkte').value).toFixed(1).replace('.', ',');
    $('vlakW').textContent = $('vlak').value;
    clearTimeout(wachtrij); wachtrij = setTimeout(bouwStereo, 150);
  });
}

/* ---------- opslaan als side-by-side (_LR.jpg) ---------- */
$('opslaan').addEventListener('click', async () => {
  const bestandsnaam = `${naam}_LR.jpg`;
  const blob = await new Promise(r => $('sbs').toBlob(r, 'image/jpeg', 0.92));
  // Chrome/Edge op de pc: zelf map kiezen en bestaand bestand kunnen overschrijven
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: bestandsnaam,
        startIn: 'pictures',
        types: [{ description: '3D-foto (JPG)', accept: { 'image/jpeg': ['.jpg'] } }]
      });
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      status(`Opgeslagen als ${handle.name}`);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;          // gebruiker klikte Annuleren
      console.warn('Opslaan via kiezer mislukt, val terug op download', e);
    }
  }
  // Quest en andere browsers: gewone download naar de map Downloads
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = bestandsnaam; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  status(`Opgeslagen in Downloads als ${bestandsnaam} (bestond hij al, dan voegt de browser "(1)" toe)`);
});

/* ---------- VR-weergave (WebXR): elk oog ziet zijn eigen beeld ---------- */
let renderer, scene, camera, vrSessie = null, vlakL, vlakR;
function initVR() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.xr.enabled = true;
  renderer.setPixelRatio(window.devicePixelRatio);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x101010);
  camera = new THREE.PerspectiveCamera(70, 1, 0.05, 100);
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}
function maakVlak(canvas, laag) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const breedte = 2.6, hoogte = breedte * canvas.height / canvas.width;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(breedte, hoogte), new THREE.MeshBasicMaterial({ map: tex }));
  m.position.set(0, 1.6, -2.2);
  m.layers.set(laag);               // laag 1 = linkeroog, laag 2 = rechteroog
  return m;
}
function zetVRBeeld() {
  for (const m of [vlakL, vlakR]) if (m) { scene.remove(m); m.material.map.dispose(); m.geometry.dispose(); }
  vlakL = maakVlak(links, 1); vlakR = maakVlak(rechts, 2);
  scene.add(vlakL, vlakR);
}
$('vr').addEventListener('click', async () => {
  if (!renderer) initVR();
  try {
    const sessie = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(sessie);
    vrSessie = sessie;
    zetVRBeeld();
    sessie.addEventListener('end', () => { vrSessie = null; });
    // met de trekker/selectknop VR verlaten
    sessie.addEventListener('select', () => sessie.end());
  } catch (err) { status('VR starten lukte niet: ' + err.message); }
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker niet geregistreerd', e));
}
modelKlaar = laadModel();
modelKlaar.catch(err => { console.error(err); balk(0); status('Model laden mislukt: ' + err.message + ' — staat de pagina via http://localhost open en is er internet?'); });
</script>
</body>
</html>
